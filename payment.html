<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; flex-direction: column; perspective: 1000px; overflow: hidden; }
        #hero-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        h1 {
            color: #00D9FF;
            margin-bottom: 30px;
            text-transform: uppercase;
            animation: titleAnimation 3s infinite alternate;
            transform-style: preserve-3d;
            position: relative;
            z-index: 1;
        }

        @keyframes titleAnimation {
            0% { transform: rotateY(-10deg) rotateX(5deg); text-shadow: 2px 2px 5px rgba(0, 217, 255, 0.5); }
            100% { transform: rotateY(10deg) rotateX(-5deg); text-shadow: -2px -2px 5px rgba(0, 217, 255, 0.5); }
        }

        .payment-method {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            border: 1px solid #444;
            padding: 15px;
            border-radius: 8px;
            width: 300px;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
            transform-style: preserve-3d;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
            background: rgba(16, 16, 16, 0.8);
        }

        .payment-method.easypaisa {
            background-color: rgba(57, 255, 20, 0.1);
        }

        .payment-method.jazzcash {
            background-color: rgba(255, 165, 0, 0.1);
        }

        .payment-method:hover {
            transform: rotateY(10deg) rotateX(5deg) scale(1.02);
            border-color: #00D9FF;
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.2);
        }

        .payment-method img { width: 50px; height: 50px; margin-right: 15px; border-radius: 5px; }
        .payment-method div { display: flex; flex-direction: column; }
        .method-name { font-weight: bold; font-size: 1.1em; }
        .account-number { color: #ccc; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="hero-canvas"></div>
    <h1>Payment Methods</h1>
    
    <div class="payment-method easypaisa">
        <img src="https://via.placeholder.com/50?text=EP" alt="EasyPaisa">
        <div>
            <span class="method-name">EasyPaisa</span>
            <span class="account-number">+92 323 7323213</span>
        </div>
    </div>

    <div class="payment-method jazzcash">
        <img src="https://via.placeholder.com/50?text=JC" alt="JazzCash">
        <div>
            <span class="method-name">JazzCash</span>
            <span class="account-number">+92 323 7323213</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('hero-canvas', {
            "particles": {
                "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#00D9FF" },
                "shape": { "type": "circle", "stroke": { "width": 0, "color": "#000000" } },
                "opacity": { "value": 0.5, "random": false, "anim": { "enable": false } },
                "size": { "value": 3, "random": true, "anim": { "enable": false } },
                "line_linked": { "enable": true, "distance": 150, "color": "#00D9FF", "opacity": 0.4, "width": 1 },
                "move": { "enable": true, "speed": 6, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "repulse" }, "onclick": { "enable": true, "mode": "push" }, "resize": true },
                "modes": { "repulse": { "distance": 100, "duration": 0.4 }, "push": { "particles_nb": 4 } }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
