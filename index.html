<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOST ON</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #fff; }
        
        #enter-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #enter-btn {
            background: #000;
            border: 2px solid #00ffff;
            color: #fff;
            padding: 20px 50px;
            font-size: 18px;
            cursor: pointer;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            font-weight: bold;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-shadow: 0 0 10px #00ffff;
        }

        #enter-btn:hover {
            border-color: #007fff;
            box-shadow: 0 0 40px rgba(0, 127, 255, 0.9);
            transform: scale(1.05);
            text-shadow: 0 0 20px #007fff;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #hero {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            perspective: 1000px;
        }

        .animated-text {
            font-size: 8em;
            font-weight: 900;
            text-transform: uppercase;
            color: #00ffff;
            transform-style: preserve-3d;
            animation: text3D 5s infinite alternate ease-in-out;
            margin: 0 0 50px 0;
        }

        @keyframes text3D {
            0% { transform: rotateY(-30deg) rotateX(15deg); text-shadow: 1px 1px 0 #007fff, 2px 2px 0 #007fff, 3px 3px 0 #007fff, 4px 4px 0 #007fff, 5px 5px 0 #007fff, 6px 6px 0 #007fff, 7px 7px 0 #007fff, 8px 8px 0 #007fff, 15px 15px 30px rgba(0,255,255,0.6); }
            100% { transform: rotateY(30deg) rotateX(-15deg); text-shadow: -1px 1px 0 #007fff, -2px 2px 0 #007fff, -3px 3px 0 #007fff, -4px 4px 0 #007fff, -5px 5px 0 #007fff, -6px 6px 0 #007fff, -7px 7px 0 #007fff, -8px 8px 0 #007fff, -15px 15px 30px rgba(0,255,255,0.6); }
        }

        @media (max-width: 768px) {
            .animated-text { font-size: 3em; }
        }

        #next-btn {
            background: #007fff;
            border: 2px solid #00ffff;
            color: #fff;
            padding: 15px 40px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            font-weight: bold;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
        }

        #next-btn:hover {
            border-color: #ccffff;
            background: #0099ff;
            transform: scale(1.05) translateZ(20px);
            box-shadow: 0 0 25px rgba(204, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div id="enter-overlay">
        <button id="enter-btn">ENTER THE EXPERIENCE</button>
    </div>

    <section id="hero">
        <h1 class="animated-text">HOST ON</h1>
        <a href="product.html" id="next-btn">NEXT</a>
    </section>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let points = [];
        const numPoints = 100;
        const mouse = { x: null, y: null };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            points = [];
            for(let i = 0; i < numPoints; i++) {
                points.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    originalVx: (Math.random() - 0.5) * 0.5,
                    originalVy: (Math.random() - 0.5) * 0.5
                });
            }
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });
        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });
        resize();

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for(let i = 0; i < numPoints; i++) {
                let p = points[i];
                
                if (mouse.x !== null && mouse.y !== null) {
                    let dx = p.x - mouse.x;
                    let dy = p.y - mouse.y;
                    let mouseDist = Math.sqrt(dx * dx + dy * dy);
                    let maxDist = 150;
                    if (mouseDist < maxDist) {
                        let force = (maxDist - mouseDist) / maxDist;
                        p.vx += (dx / mouseDist) * force * 0.5;
                        p.vy += (dy / mouseDist) * force * 0.5;
                    } else {
                        p.vx += (p.originalVx - p.vx) * 0.01;
                        p.vy += (p.originalVy - p.vy) * 0.01;
                    }
                } else {
                    p.vx += (p.originalVx - p.vx) * 0.01;
                    p.vy += (p.originalVy - p.vy) * 0.01;
                }

                p.x += p.vx;
                p.y += p.vy;

                if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if(p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.fillStyle = '#00ffff';
                ctx.fillRect(p.x - 1, p.y - 1, 2, 2);

                for(let j = i + 1; j < numPoints; j++) {
                    let p2 = points[j];
                    let dist = Math.sqrt((p.x - p2.x) ** 2 + (p.y - p2.y) ** 2);
                    if(dist < 100) {
                        ctx.strokeStyle = `rgba(0, 255, 255, ${1 - dist / 100})`;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        const enterBtn = document.getElementById('enter-btn');
        const enterOverlay = document.getElementById('enter-overlay');
        const heroSection = document.getElementById('hero');

        enterBtn.addEventListener('click', function() {
            enterOverlay.style.display = 'none';
            heroSection.style.display = 'flex';
            
            const utterance = new SpeechSynthesisUtterance("Welcome to HOST ON");
            window.speechSynthesis.speak(utterance);
        });
    </script>
</body>
</html>
